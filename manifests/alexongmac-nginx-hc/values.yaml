Upgrading
To 19.0.0
The , WebDAV protocol, has been converted into a dynamic module under the /opt/bitnami/nginx/modules directory. It is necessary to include the directive load_module /opt/bitnami/nginx/modules/ngx_http_dav_module.so; to enable its functionality.

To 18.3.0
This version introduces image verification for security purposes. To disable it, set global.security.allowInsecureImages to true. More details at .

To 16.0.0
This major bump changes the following security defaults:

runAsGroup is changed from 0 to 1001
readOnlyRootFilesystem is set to true
resourcesPreset is changed from none to the minimum size working in our test suites (NOTE: resourcesPreset is not meant for production usage, but resources adapted to your use case).
global.compatibility.openshift.adaptSecurityContext is changed from disabled to auto.
This could potentially break any customization or init scripts used in your deployment. If this is the case, change the default values to the previous ones.

To 11.0.0
This major release renames several values in this chart and adds missing features, in order to be aligned with the rest of the assets in the Bitnami charts repository.

Affected values:

service.port was renamed as service.ports.http.
service.httpsPort was deprecated. We recommend using service.ports.https.
serviceAccount.autoMount was renamed as serviceAccount.automountServiceAccountToken
metrics.serviceMonitor.additionalLabels was renamed as metrics.serviceMonitor.labels
To 10.0.0
This major release no longer uses the bitnami/nginx-ldap-auth-daemon container as a dependency since its upstream project is not actively maintained.

2022-04-12 edit:

.

On 9 April 2022, security vulnerabilities in the  were publicly shared. Although the deprecation of this container from the Bitnami catalog was not related to this security issue,  you can find more information from the Bitnami security team.

To 8.0.0
, this major version is the result of the required changes applied to the Helm Chart to be able to incorporate the different features added in Helm v3 and to be consistent with the Helm project itself regarding the Helm v2 EOL.

What changes were introduced in this major version?
Previous versions of this Helm Chart use apiVersion: v1 (installable by both Helm 2 and 3), this Helm Chart was updated to apiVersion: v2 (installable by Helm 3 only).  you can find more information about the apiVersion field.
Move dependency information from the requirements.yaml to the Chart.yaml
After running helm dependency update, a Chart.lock file is generated containing the same structure used in the previous requirements.lock
The different fields present in the Chart.yaml file has been ordered alphabetically in a homogeneous way for all the Bitnami Helm Charts
Considerations when upgrading to this version
If you want to upgrade to this version from a previous one installed with Helm v3, you shouldn't face any issues
If you want to upgrade to this version using Helm v2, this scenario is not supported as this version doesn't support Helm v2 anymore
If you installed the previous version with Helm v2 and wants to upgrade to this version with Helm v3, please refer to the  about migrating from Helm v2 to v3
Useful links
To 7.0.0
This version also introduces bitnami/common, a  as a dependency. More documentation about this new utility could be found . Please, make sure that you have updated the chart dependencies before executing any upgrade.
Ingress configuration was also adapted to follow the Helm charts best practices.
Note: There is no backwards compatibility due to the above mentioned changes. It's necessary to install a new release of the chart, and migrate your existing application to the new NGINX instances.

To 5.6.0
Added support for the use of LDAP.

To 5.0.0
Backwards compatibility is not guaranteed unless you modify the labels used on the chart's deployments. Use the workaround below to upgrade from versions previous to 5.0.0. The following example assumes that the release name is nginx:

kubectl delete deployment nginx --cascade=false
helm upgrade nginx oci://REGISTRY_NAME/REPOSITORY_NAME/nginx
Note: You need to substitute the placeholders REGISTRY_NAME and REPOSITORY_NAME with a reference to your Helm chart registry and repository. For example, in the case of Bitnami, you need to use REGISTRY_NAME=registry-1.docker.io and REPOSITORY_NAME=bitnamicharts.

To 1.0.0
Backwards compatibility is not guaranteed unless you modify the labels used on the chart's deployments. Use the workaround below to upgrade from versions previous to 1.0.0. The following example assumes that the release name is nginx:

kubectl patch deployment nginx --type=json -p='[{"op": "remove", "path": "/spec/selector/matchLabels/chart"}]'
