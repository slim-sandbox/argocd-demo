# NGINX Helm values
# Chart version: 19.0.2

global:
  security:
    allowInsecureImages: true

replicaCount: 1

image:
  registry: docker.io
  repository: bitnamilegacy/nginx
  tag: 1.27.4-debian-12-r6

service:
  type: ClusterIP
  ports:
    http: 80
    https: 443

resourcesPreset: nano

ingress:
  enabled: false

metrics:
  enabled: false
