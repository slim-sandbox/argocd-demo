replicaCount: 2

image:
  registry: docker.io
  repository: bitnami/nginx
  tag: 1.25.4-debian-12-r0
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  ports:
    http: 80

# Explicitly disable TLS to prevent mounting nginx-hc-tls
tls:
  enabled: false

resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi