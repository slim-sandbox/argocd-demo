   apiVersion: argoproj.io/v1alpha1
   kind: Application
   metadata:
     name: zeyaul-nginx-hc                       # ① your app name (must be unique)
     finalizers:
       - resources-finalizer.argocd.argoproj.io
   spec:
     project: default
     sources:
       - repoURL: registry-1.docker.io/bitnamicharts
         chart: nginx
         targetRevision: 19.0.2
         helm:
           releaseName: nginx-hc
           valueFiles:
             - $values/manifests/zeyaul-nginx-hc/values.yaml   # ② YOUR values file
       - repoURL: https://github.com/slim-sandbox/argocd-demo.git
         targetRevision: HEAD
         ref: values
     destination:
       namespace: zeyaul-ns                      # ③ YOUR namespace
       server: "https://kubernetes.default.svc"
     syncPolicy:
       syncOptions:
         - CreateNamespace=true
       automated:
         prune: true
         selfHeal: true