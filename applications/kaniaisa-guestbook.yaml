apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kaniaisa-guestbook
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/kaniaisa/kaniaisa-guestbook.git
    targetRevision: main
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: kaniaisa-ns
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
