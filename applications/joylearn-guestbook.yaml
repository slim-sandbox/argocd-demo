apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: joylearn-guestbook
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    path: guestbook
    repoURL: https://github.com/joylearn/joylearn-guestbook.git
    targetRevision: main
  destination:
    namespace: joylearn-ns
    server: https://kubernetes.default.svc
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true