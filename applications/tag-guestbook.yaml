apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tag-guestbook
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/tagitables/tag-argocd-guestbook.git
    targetRevision: main
    path: manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: tag-ns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
