apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: yq-guestbook
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    path: .
    repoURL: https://github.com/yqyeoh/3.14-argocd-guestbook-app.git
    targetRevision: HEAD
  destination:
    namespace: yq-ns
    server: https://kubernetes.default.svc
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
